name: DocFlow CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and Testcontainers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload Maven reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Scan generated bundle for secrets
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/frontend/dist:/scan:ro" \
            zricethezav/gitleaks:v8.24.2 \
            detect --source=/scan --no-git --redact --exit-code 1

  kubernetes-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render Kustomize manifests
        run: kubectl kustomize infra/kubernetes/local > /dev/null

      - name: Parse local deploy script
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/k8s-local-deploy.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  dependency-scan:
    name: Dependency scan
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan dependency manifests
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            aquasec/trivy:0.58.1 \
            fs --scanners vuln --pkg-types library --skip-java-db-update \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 --skip-dirs /repo/frontend/node_modules \
            --skip-dirs /repo/frontend/dist --skip-dirs /repo/backend/target /repo

  image:
    name: Build, scan and publish backend image
    needs:
      - backend
      - frontend
      - kubernetes-manifests
      - dependency-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" --file backend/Dockerfile backend

      - name: Export image for scan
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" --output "${RUNNER_TEMP}/docflow-backend-image.tar"

      - name: Scan image
        run: |
          docker run --rm \
            -v "${RUNNER_TEMP}:/scan:ro" \
            aquasec/trivy:0.58.1 \
            image --input /scan/docflow-backend-image.tar \
            --scanners vuln --pkg-types os \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:main"

      - name: Publish commit-tagged image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:main"
