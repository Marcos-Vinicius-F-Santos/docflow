openapi: 3.1.0
info:
  title: DocFlow API
  version: 1.0.0
  description: >-
    Contrato REST implementado pelo backend DocFlow. Operações de negócio exigem
    Bearer token quando a segurança está habilitada.
servers:
  - url: https://docflow-backend-g2e2.onrender.com
    description: Render
  - url: http://localhost:8080
    description: Local
tags:
  - name: Documents
  - name: Operational logs
  - name: Health
paths:
  /documents:
    get:
      tags: [Documents]
      summary: List documents
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Documents ordered by update time.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DocumentResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Documents]
      summary: Register a document for asynchronous processing
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document staged and published.
          headers:
            Location: {schema: {type: string, format: uri-reference}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/DocumentResponse'}}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Problem503'}
  /documents/{documentId}:
    parameters:
      - {$ref: '#/components/parameters/DocumentId'}
    get:
      tags: [Documents]
      summary: Get document metadata
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Document metadata.
          content:
            application/json: {schema: {$ref: '#/components/schemas/DocumentResponse'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/Problem404'}
    delete:
      tags: [Documents]
      summary: Delete a document and its objects
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Document deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/Problem404'}
        '503': {$ref: '#/components/responses/Problem503'}
  /documents/{documentId}/retry:
    parameters:
      - {$ref: '#/components/parameters/DocumentId'}
    post:
      tags: [Documents]
      summary: Retry a failed document
      security: [{bearerAuth: []}]
      responses:
        '202':
          description: Retry accepted.
          content:
            application/json: {schema: {$ref: '#/components/schemas/DocumentResponse'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/Problem404'}
        '409': {$ref: '#/components/responses/Problem409'}
        '503': {$ref: '#/components/responses/Problem503'}
  /documents/{documentId}/content:
    parameters:
      - {$ref: '#/components/parameters/DocumentId'}
    get:
      tags: [Documents]
      summary: Download completed document content
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Document bytes.
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/Problem404'}
        '409': {$ref: '#/components/responses/Problem409'}
        '503': {$ref: '#/components/responses/Problem503'}
  /documents/{documentId}/preview:
    parameters:
      - {$ref: '#/components/parameters/DocumentId'}
    get:
      tags: [Documents]
      summary: Preview completed document content inline
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Document bytes for inline display.
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/Problem404'}
        '409': {$ref: '#/components/responses/Problem409'}
        '503': {$ref: '#/components/responses/Problem503'}
  /logs:
    get:
      tags: [Operational logs]
      summary: Query operational logs
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: level, in: query, schema: {type: string, enum: [INFO, WARN, ERROR]}}
        - {name: service, in: query, schema: {type: string}}
        - {name: component, in: query, schema: {type: string}}
        - {name: operation, in: query, schema: {type: string}}
        - {name: documentId, in: query, schema: {type: string, format: uuid}}
        - {name: correlationId, in: query, schema: {type: string, format: uuid}}
        - {name: occurredFrom, in: query, schema: {type: string, format: date-time}}
        - {name: occurredTo, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Paginated operational logs.}
        '400': {$ref: '#/components/responses/Problem400'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Problem503'}
  /actuator/health/liveness:
    get:
      tags: [Health]
      summary: Process liveness
      responses: {'200': {description: Process is alive.}}
  /actuator/health/readiness:
    get:
      tags: [Health]
      summary: Dependency readiness
      responses:
        '200': {description: Process and required dependencies are ready.}
        '503': {description: A required dependency is unavailable.}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    DocumentResponse:
      type: object
      required: [id, originalFilename, contentType, sizeBytes, status]
      properties:
        id: {type: string, format: uuid}
        originalFilename: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer, format: int64, minimum: 0}
        status: {type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        falhas: {type: integer, format: int64, minimum: 0}
        isExcluded: {type: boolean}
        exclusionScheduledAt: {type: string, format: date-time, nullable: true}
    ProblemDetail:
      type: object
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        errorCode: {type: string}
        invalidField: {type: string}
  responses:
    Unauthorized:
      description: Authentication is required.
      content: {application/json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}
    Problem400:
      description: Invalid request.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}
    Problem404:
      description: Resource not found.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}
    Problem409:
      description: Operation is not currently eligible.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}
    Problem503:
      description: Temporary dependency failure.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}
