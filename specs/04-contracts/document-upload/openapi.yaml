openapi: 3.1.0
info:
  title: DocFlow Document API
  version: 0.1.0
  description: Contract for registering documents with binary content.
paths:
  /documents:
    post:
      operationId: registerDocument
      summary: Register and store a document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
            encoding:
              content:
                contentType: application/octet-stream
      responses:
        '201':
          description: Document content was stored and its reference was persisted.
          headers:
            Location:
              description: URL of the registered document.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '202':
          description: The storage result was not confirmed; the document is not complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          $ref: '#/components/responses/InvalidDocumentRequest'
        '409':
          $ref: '#/components/responses/ConcurrentDocumentOperation'
        '500':
          $ref: '#/components/responses/PersistenceFinalizationFailure'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /documents/{documentId}:
    get:
      operationId: findDocumentById
      summary: Find a document by ID
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document metadata and storage state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
components:
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    DocumentUploadRequest:
      type: object
      required:
        - content
        - originalFilename
        - contentType
        - sizeBytes
      properties:
        content:
          type: string
          format: binary
          description: Binary content of the document.
        originalFilename:
          type: string
          minLength: 1
          description: Original filename as metadata; it does not identify the storage object.
        contentType:
          type: string
          minLength: 1
          description: Declared media type associated with the content.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Declared number of bytes in the content.
    DocumentResponse:
      type: object
      required:
        - id
        - originalFilename
        - contentType
        - sizeBytes
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        originalFilename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Problem:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          enum:
            - INVALID_DOCUMENT_METADATA
            - CONTENT_SIZE_MISMATCH
            - STORAGE_UNAVAILABLE
            - STORAGE_REJECTED
            - STORAGE_RESULT_UNKNOWN
            - PERSISTENCE_FINALIZATION_FAILED
            - CONCURRENT_DOCUMENT_OPERATION
            - DOCUMENT_NOT_FOUND
        message:
          type: string
        documentId:
          type: string
          format: uuid
        correlationId:
          type: string
        retryable:
          type: boolean
  responses:
    InvalidDocumentRequest:
      description: Metadata or content is invalid or inconsistent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConcurrentDocumentOperation:
      description: Another operation for the same document is in progress or already completed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PersistenceFinalizationFailure:
      description: Storage may have succeeded, but document finalization was not persisted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StorageUnavailable:
      description: Object storage is unavailable or rejected the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DocumentNotFound:
      description: Document does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
