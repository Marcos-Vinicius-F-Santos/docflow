apiVersion: v1
kind: ConfigMap
metadata:
  name: docflow-config
  namespace: docflow-staging
  labels:
    app.kubernetes.io/part-of: docflow
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_MANAGEMENT_PORT: "15672"
  MINIO_ENDPOINT: http://minio:9000
  MINIO_STAGING_BUCKET: docflow-staging
  MINIO_BUCKET: docflow-documents
  MINIO_CONNECT_TIMEOUT: PT3S
  MINIO_READ_TIMEOUT: PT3S
  MINIO_WRITE_TIMEOUT: PT3S
  DOCFLOW_MESSAGING_ENABLED: "true"
  DOCFLOW_RECONCILIATION_ENABLED: "true"
  DOCFLOW_RECONCILIATION_MAX_ATTEMPTS: "5"
  DOCFLOW_RECONCILIATION_BACKOFF: PT1M,PT5M,PT15M,PT30M,PT60M
  DOCFLOW_RECONCILIATION_SCHEDULE_INTERVAL: PT1M
  DOCFLOW_PROCESSING_TIMEOUT: PT3S
  DOCFLOW_NOTIFICATION_WEBSOCKET_ALLOWED_ORIGINS: http://localhost:4200
  DOCFLOW_LOG_RETENTION: PT3H
  DOCFLOW_LOG_RETENTION_SCHEDULE_INTERVAL: PT1M
  DOCFLOW_LOGS_MAX_PAGE_SIZE: "100"
  WEB3FORMS_API_URL: https://api.web3forms.com/submit
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: docflow-staging
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: docflow
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: docflow-staging
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: docflow
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: docflow
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: docflow-staging
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: docflow
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: docflow-staging
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: docflow
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: docflow
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: docflow-staging
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: docflow
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: docflow-staging
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: docflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: docflow
    spec:
      containers:
        - name: minio
          image: minio:docflow-local
          imagePullPolicy: Never
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
  strategy:
    type: Recreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: docflow-staging
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: docflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
