apiVersion: apps/v1
kind: Deployment
metadata:
  name: docflow-backend
  namespace: docflow-staging
  labels:
    app.kubernetes.io/name: docflow-backend
    app.kubernetes.io/part-of: docflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docflow-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docflow-backend
        app.kubernetes.io/part-of: docflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: docflow-backend:k8s-local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: docflow-config
            - secretRef:
                name: docflow-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: docflow-backend
  namespace: docflow-staging
  labels:
    app.kubernetes.io/name: docflow-backend
    app.kubernetes.io/part-of: docflow
spec:
  selector:
    app.kubernetes.io/name: docflow-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
