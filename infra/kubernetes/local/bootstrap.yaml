apiVersion: batch/v1
kind: Job
metadata:
  name: docflow-bootstrap
  namespace: docflow-staging
  labels:
    app.kubernetes.io/name: docflow-bootstrap
    app.kubernetes.io/part-of: docflow
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docflow-bootstrap
        app.kubernetes.io/part-of: docflow
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: docflow-bootstrap:k8s-local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: docflow-config
            - secretRef:
                name: docflow-secrets
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: MINIO_ROOT_PASSWORD
