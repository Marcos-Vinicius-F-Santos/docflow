services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 mantém os dados em um diretório por versão.
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
