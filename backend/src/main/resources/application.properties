spring.application.name=dockflow

# PostgreSQL: POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD are required.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# RabbitMQ credentials are required; host and port default to the local Compose mapping.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

# Messaging can be disabled only by an explicit environment/test override.
docflow.messaging.enabled=${DOCFLOW_MESSAGING_ENABLED:true}

# Reconciliation contract. The scheduler cadence is defined by its application
# component; these values are the approved policy it must enforce.
docflow.reconciliation.enabled=${DOCFLOW_RECONCILIATION_ENABLED:true}
docflow.reconciliation.max-attempts=${DOCFLOW_RECONCILIATION_MAX_ATTEMPTS:5}
docflow.reconciliation.backoff=${DOCFLOW_RECONCILIATION_BACKOFF:PT1M,PT5M,PT15M,PT30M,PT60M}
docflow.reconciliation.schedule-interval=${DOCFLOW_RECONCILIATION_SCHEDULE_INTERVAL:PT1M}

docflow.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
docflow.storage.minio.access-key=${MINIO_ACCESS_KEY}
docflow.storage.minio.secret-key=${MINIO_SECRET_KEY}
docflow.storage.minio.connect-timeout=${MINIO_CONNECT_TIMEOUT:PT3S}
docflow.storage.minio.read-timeout=${MINIO_READ_TIMEOUT:PT3S}
docflow.storage.minio.write-timeout=${MINIO_WRITE_TIMEOUT:PT3S}
docflow.processing.timeout=${DOCFLOW_PROCESSING_TIMEOUT:PT3S}
docflow.storage.staging-bucket=${MINIO_STAGING_BUCKET:docflow-staging}
docflow.storage.bucket=${MINIO_BUCKET:docflow-documents}
spring.servlet.multipart.max-file-size=52428800B
spring.servlet.multipart.max-request-size=52428800B
